<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Boston Trees · Maurice Neme</title>
    <meta
      name="description"
      content="An interactive dashboard of the trees planted across Boston, built with Streamlit and running entirely in your browser."
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.9.1/build/stlite.css" />
    <style>
      html,
      body {
        margin: 0;
        background: #0f131a;
        color: #e9edf3;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }

      /* Shown until the app takes over the page */
      #loading {
        display: grid;
        place-items: center;
        gap: 0.75rem;
        min-height: 100dvh;
        padding: 1rem;
        text-align: center;
      }

      #loading h1 {
        margin: 0;
        font-size: 1.25rem;
      }

      #loading p {
        margin: 0;
        max-width: 32rem;
        color: #aab4c3;
        line-height: 1.6;
      }

      #loading a {
        color: #ff6a1f;
      }

      .spinner {
        width: 2rem;
        height: 2rem;
        border: 3px solid #273142;
        border-top-color: #ff6a1f;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .spinner {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="loading">
        <div class="spinner"></div>
        <h1>Loading Boston Trees…</h1>
        <p>
          This dashboard runs Python right in your browser, so the first visit takes a few seconds
          to download it. After that it loads fast. Built by
          <a href="https://mauriceneme.com">Maurice Neme</a>.
        </p>
      </div>
    </div>

    <script type="module">
      // stlite runs the Streamlit app in the browser with WebAssembly (no server).
      import { mount } from 'https://cdn.jsdelivr.net/npm/@stlite/browser@1.9.1/build/stlite.js'

      const files = [
        'tree/NavSetup.py',
        'tree/views/data.py',
        'tree/views/overview.py',
        'tree/views/q1_growth_over_time.py',
        'tree/views/q2_species_neighborhood.py',
        'tree/views/q3_average_size.py',
        'tree/views/q4_rare_species.py',
        'tree/views/trees.csv.gz',
      ]

      const entries = await Promise.all(
        files.map(async (path) => {
          const response = await fetch(path)
          if (!response.ok) throw new Error(`Could not load ${path}`)
          // The gzipped data is binary; the Python files are text
          return path.endsWith('.gz')
            ? [path, new Uint8Array(await response.arrayBuffer())]
            : [path, await response.text()]
        }),
      )

      mount(
        {
          requirements: ['pandas', 'altair', 'pydeck'],
          // Hide Streamlit's own "Deploy" button and hamburger menu: they don't apply here
          streamlitConfig: { 'client.toolbarMode': 'minimal' },
          entrypoint: 'tree/NavSetup.py',
          files: Object.fromEntries(entries),
        },
        document.getElementById('root'),
      )
    </script>
  </body>
</html>
